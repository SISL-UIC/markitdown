name: tests
jobs:
  tests:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v5
      with:
        python-version: |
          3.10
          3.11
          3.12
    - name: Install Hatch
      run: pipx install hatch
    - name: Run tests
      run: cd packages/markitdown; hatch test
    timeout-minutes: 6
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
- pull_request
